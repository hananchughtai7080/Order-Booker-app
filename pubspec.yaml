name: order_booker
description: Offline order booking, ledger and reminder app for distributors (Dera Ghazi Khan).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  provider: ^6.1.2
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  flutter_local_notifications: ^18.0.1
  csv: ^6.0.0
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
